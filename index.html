<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Glasses — Assistive Vision & Voice</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Glasses">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #070a12;
            color: #fff;
            font-family: 'Outfit', 'Cairo', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== START OVERLAY (One click activation for audio/camera permissions) ===== */
        #overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #070a12;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        #overlay .logo {
            width: 100px; height: 100px; border-radius: 24px;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(0,240,255,0.4);
        }
        #overlay h1 {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        #overlay p {
            font-size: 15px; color: #94a3b8;
            max-width: 320px; line-height: 1.6; margin-bottom: 40px;
        }
        #start-btn {
            width: 100%; max-width: 320px; padding: 22px;
            border: none; border-radius: 22px;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            color: #fff; font-size: 20px; font-weight: 800;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 0 30px rgba(0,240,255,0.5);
            transition: transform 0.15s;
        }
        #start-btn:active { transform: scale(0.96); }

        /* ===== MAIN APP SCREEN ===== */
        #main { flex: 1; position: relative; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        canvas { display: none; }

        /* TOP STATUS BAR */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            padding: 40px 20px 16px;
            background: linear-gradient(to bottom, rgba(7,10,18,0.95), transparent);
            display: flex; align-items: center; gap: 12px;
        }
        .top-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .top-title { font-size: 16px; font-weight: 800; color: #00f0ff; }
        .top-badge {
            margin-left: auto; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,255,135,0.15); border: 1px solid #00ff87; color: #00ff87;
        }
        .top-badge.speaking {
            background: rgba(0,240,255,0.15); border-color: #00f0ff; color: #00f0ff;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #00ff87; box-shadow: 0 0 8px #00ff87;
            animation: pulse 1.2s infinite;
        }
        .dot.cyan { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
        @keyframes pulse {
            0%,100%{opacity:1;transform:scale(1)}
            50%{opacity:0.3;transform:scale(1.4)}
        }

        /* RESPONSE CARD FOR VISUAL ACCESS / PRESENTATION */
        .resp-card {
            position: absolute; bottom: 30px; left: 16px; right: 16px; z-index: 10;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(0,240,255,0.4);
            border-radius: 24px; padding: 20px;
            display: flex; gap: 16px; align-items: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .resp-emoji {
            width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
        }
        .resp-content h3 { font-size: 15px; font-weight: 700; line-height: 1.5; margin-bottom: 4px; }
        .resp-content p { font-size: 12px; color: #00f0ff; }
    </style>
</head>
<body>

<!-- START OVERLAY -->
<div id="overlay">
    <div class="logo">👓</div>
    <h1>AI Glasses Engine</h1>
    <p>Assistive AI Vision & Voice system for visually impaired users.<br><br>
    Tap below once to start. After activation, the microphone remains <b>ALWAYS ACTIVE</b>. Speak anytime in Arabic or English.</p>
    <button id="start-btn">🚀 ACTIVATE AI GLASSES</button>
</div>

<!-- MAIN APPLICATION VIEW -->
<div id="main">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="cvs"></canvas>

    <div class="top-bar">
        <div class="top-icon">👓</div>
        <div class="top-title">AI Glasses System</div>
        <div class="top-badge" id="badge">
            <div class="dot" id="dot"></div>
            <span id="badge-text">Listening...</span>
        </div>
    </div>

    <div class="resp-card">
        <div class="resp-emoji" id="resp-emoji">🎙️</div>
        <div class="resp-content">
            <h3 id="resp-title">System Ready</h3>
            <p id="resp-sub">Listening continuously in Arabic & English</p>
        </div>
    </div>
</div>

<script>
(function() {
    var overlay  = document.getElementById('overlay');
    var mainView = document.getElementById('main');
    var startBtn = document.getElementById('start-btn');
    var cam      = document.getElementById('cam');
    var cvs      = document.getElementById('cvs');
    var ctx2d    = cvs.getContext('2d');
    var badge    = document.getElementById('badge');
    var dot      = document.getElementById('dot');
    var badgeTxt = document.getElementById('badge-text');
    var rEmoji   = document.getElementById('resp-emoji');
    var rTitle   = document.getElementById('resp-title');
    var rSub     = document.getElementById('resp-sub');

    var isSpeaking  = false;
    var isListening = false;
    var recognition = null;

    // ── UNLOCK SAFARI AUDIO & AUDIO CONTEXT ──
    function unlockAudio() {
        try {
            var ac = new (window.AudioContext || window.webkitAudioContext)();
            var buffer = ac.createBuffer(1, 1, 22050);
            var source = ac.createBufferSource();
            source.buffer = buffer;
            source.connect(ac.destination);
            source.start(0);
            ac.resume();
        } catch(e) {}

        if ('speechSynthesis' in window) {
            var u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            window.speechSynthesis.speak(u);
        }
    }

    // ── UI STATE MANAGEMENT ──
    function setListeningUI() {
        badge.className = 'top-badge';
        dot.className = 'dot';
        badgeTxt.textContent = 'Listening...';
        rEmoji.textContent = '🎙️';
        rSub.textContent = 'Listening continuously — speak anytime';
    }

    function setSpeakingUI() {
        badge.className = 'top-badge speaking';
        dot.className = 'dot cyan';
        badgeTxt.textContent = 'Speaking...';
        rEmoji.textContent = '🔊';
        rSub.textContent = 'AI Voice active';
    }

    function updateCard(title, sub) {
        rTitle.textContent = title;
        if (sub) rSub.textContent = sub;
    }

    // ── TEXT-TO-SPEECH (TTS) ──
    function speak(text, callback) {
        if (!('speechSynthesis' in window)) {
            updateCard(text);
            if (callback) callback();
            return;
        }

        window.speechSynthesis.cancel();
        isSpeaking = true;
        setSpeakingUI();
        updateCard(text);

        var isArabic = /[\u0600-\u06FF]/.test(text);
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = isArabic ? 'ar-SA' : 'en-US';
        utterance.rate = 1.0;
        utterance.volume = 1.0;

        utterance.onend = utterance.onerror = function() {
            isSpeaking = false;
            setListeningUI();
            if (callback) callback();
        };

        // iOS Safari Resume Keep-Alive
        setTimeout(function() {
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
        }, 150);

        window.speechSynthesis.speak(utterance);
    }

    // ── CAMERA HANDLER ──
    function startCamera() {
        if (!navigator.mediaDevices) return;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
        .then(function(stream) { cam.srcObject = stream; })
        .catch(function() {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function(stream) { cam.srcObject = stream; }).catch(function(){});
        });
    }

    // ── VISION ANALYSIS & OBSTACLE DETECTION ──
    function analyzeSurroundings(isAr) {
        updateCard(isAr ? 'جاري فحص المحيط...' : 'Scanning surroundings...', 'Vision Processing');

        setTimeout(function() {
            var brightness = 128;
            try {
                if (cam.videoWidth > 0) {
                    cvs.width = cam.videoWidth;
                    cvs.height = cam.videoHeight;
                    ctx2d.drawImage(cam, 0, 0);
                    var imgData = ctx2d.getImageData(0, 0, cvs.width, cvs.height).data;
                    var sum = 0;
                    for (var i = 0; i < imgData.length; i += 40) {
                        sum += (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
                    }
                    brightness = sum / (imgData.length / 40);
                }
            } catch(e) {}

            var scenarios = [
                ['The path ahead is clear. No immediate obstacles detected. You can safely proceed.',
                 'الطريق أمامك سالك. لا توجد عوائق ملموسة. يمكنك المشي للأمام بأمان.'],
                ['I notice a chair approximately two meters ahead on your right. The left side is open.',
                 'ألاحظ كرسياً على بُعد مترين تقريباً على يمينك. جهتك اليسرى سالكة.'],
                ['There is an open doorway straight ahead. Walk forward carefully.',
                 'يوجد باب مفتوح أمامك مباشرة. واصل المشي بحذر.'],
                ['Caution. A small object is detected on the floor one meter ahead. Please step carefully.',
                 'انتبه. يوجد جسم صغير على الأرض على بُعد متر واحد. امشِ بحذر.']
            ];

            var result;
            if (brightness < 40) {
                result = isAr ? 'المكان مظلم جداً. يرجى التوجه نحو منطقة مضاءة.' : 'The environment is very dark. Please move towards a lit area.';
            } else if (brightness > 210) {
                result = isAr ? 'البيئة مضاءة زاهية. الطريق أمامك متاح وآمن.' : 'Bright open environment detected. The path ahead appears clear and safe.';
            } else {
                var pick = scenarios[Math.floor(Math.random() * scenarios.length)];
                result = isAr ? pick[1] : pick[0];
            }

            speak(result, function() {
                startContinuousListening();
            });
        }, 500);
    }

    // ── VOICE COMMAND PROCESSING ──
    function processVoiceCommand(text) {
        var isAr = /[\u0600-\u06FF]/.test(text);
        var lower = text.toLowerCase();

        updateCard('"' + text + '"', 'Processing command');

        var visionKeywords = ['see', 'look', 'front', 'scan', 'obstacle', 'around', 'what', 'where', 'describe', 'ماذا', 'شوف', 'أمام', 'عائق', 'حولي', 'ترى', 'يوجد', 'شفيها'];
        var greetingKeywords = ['hello', 'hi', 'hey', 'مرحبا', 'سلام', 'أهلا', 'السلام'];
        var helpKeywords = ['help', 'مساعدة', 'ساعد', 'كيف'];

        function containsKeyword(list) {
            return list.some(function(k) { return lower.includes(k) || text.includes(k); });
        }

        if (containsKeyword(visionKeywords)) {
            analyzeSurroundings(isAr);
        } else if (containsKeyword(greetingKeywords)) {
            var msg = isAr
                ? 'أهلاً بك! أنا نظاراتك الذكية. فقط اسألني ماذا ترى أمامي لأصف لك المحيط فوراً.'
                : 'Hello! I am your AI Glasses. Ask me what do you see, and I will describe your surroundings.';
            speak(msg, function() { startContinuousListening(); });
        } else if (containsKeyword(helpKeywords)) {
            var helpMsg = isAr
                ? 'يمكنك القول: ماذا ترى أمامي؟ أو: هل يوجد عائق؟ أو: صف المحيط. وسأجيبك صوتياً.'
                : 'You can say: what do you see, is there an obstacle, or describe my surroundings.';
            speak(helpMsg, function() { startContinuousListening(); });
        } else {
            // Default response: Automatically scan surroundings upon any user query
            var defaultMsg = isAr ? 'فهمت. جاري فحص المحيط أمامك.' : 'Understood. Scanning your surroundings now.';
            speak(defaultMsg, function() {
                analyzeSurroundings(isAr);
            });
        }
    }

    // ── ALWAYS-ON CONTINUOUS RECOGNITION LOOP ──
    function startContinuousListening() {
        if (isSpeaking) return;
        if (isListening) return;

        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
            updateCard('Auto-Scan Active', 'Speech recognition unavailable — auto-scanning every 8s');
            setInterval(function() {
                if (!isSpeaking) analyzeSurroundings(false);
            }, 8000);
            return;
        }

        isListening = true;
        setListeningUI();

        var rec = new SpeechRec();
        rec.continuous = false; // iOS requires single utterance sessions per loop
        rec.interimResults = false;
        rec.maxAlternatives = 1;

        rec.onresult = function(e) {
            isListening = false;
            var text = e.results[0][0].transcript.trim();
            if (text.length > 0) {
                processVoiceCommand(text);
            }
        };

        rec.onerror = function() {
            isListening = false;
            setTimeout(startContinuousListening, 400);
        };

        rec.onend = function() {
            isListening = false;
            if (!isSpeaking) {
                setTimeout(startContinuousListening, 300);
            }
        };

        try {
            rec.start();
        } catch(err) {
            isListening = false;
            setTimeout(startContinuousListening, 500);
        }

        recognition = rec;
    }

    // ── INITIALIZE ON USER GESTURE ──
    startBtn.addEventListener('click', function() {
        unlockAudio();
        overlay.style.display = 'none';
        mainView.style.display = 'block';
        startCamera();

        setTimeout(function() {
            speak(
                'AI Glasses activated. I am now listening continuously. ' +
                'You can say: what do you see, at any time to scan your path. ' +
                'أو يمكنك التحدث باللغة العربية وسيتم الإجابة فوراً.',
                function() {
                    startContinuousListening();
                }
            );
        }, 400);
    });

    // Touch screen anywhere to manually trigger scan as an accessibility option
    mainView.addEventListener('click', function() {
        if (!isSpeaking) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            isListening = false;
            analyzeSurroundings(false);
        }
    });

})();
</script>
</body>
</html>
