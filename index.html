<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Glasses — Assistive Vision & Voice Engine</title>
    
    <!-- PWA Settings for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Glasses">
    <link rel="apple-touch-icon" href="src/ai_glasses/resources/ai_glasses.png">
    <link rel="icon" type="image/png" href="src/ai_glasses/resources/ai_glasses.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(15, 23, 42, 0.92);
            --accent-cyan: #00f0ff;
            --accent-purple: #7a00ff;
            --accent-green: #00ff87;
            --danger: #ff0055;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Cairo', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- iOS Touch Unlock Screen --- */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(7, 10, 18, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        #start-overlay img {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            box-shadow: 0 0 30px var(--accent-cyan);
            margin-bottom: 20px;
        }

        #start-overlay h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        #start-overlay p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 30px;
            max-width: 280px;
            line-height: 1.5;
        }

        .start-btn {
            width: 100%;
            max-width: 280px;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transition: transform 0.2s;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- Header --- */
        header {
            padding: 14px 20px;
            background: rgba(7, 10, 18, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
        }

        .header-title h1 {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .header-title p {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* --- Camera Viewport --- */
        .viewport {
            position: relative;
            flex: 1;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        /* Voice Status Banner */
        .voice-card {
            position: absolute;
            bottom: 110px;
            left: 16px;
            right: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .mic-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .voice-info {
            flex: 1;
        }

        .voice-info h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .voice-info p {
            font-size: 12px;
            color: var(--accent-cyan);
        }

        /* --- Giant Touch Controls --- */
        .control-bar {
            height: 95px;
            background: rgba(7, 10, 18, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            z-index: 20;
        }

        .action-btn {
            flex: 1;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-scan {
            background: linear-gradient(135deg, var(--accent-cyan), #0072ff);
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }

        .btn-voice {
            background: linear-gradient(135deg, var(--accent-purple), var(--danger));
            box-shadow: 0 4px 15px rgba(122, 0, 255, 0.3);
        }

        .btn-sub {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- iOS Audio & Camera Unlock Overlay -->
    <div id="start-overlay">
        <img src="src/ai_glasses/resources/ai_glasses.png" alt="Logo">
        <h1>AI Glasses Engine</h1>
        <p>Tap below to unlock audio, voice assistant, and live camera vision.</p>
        <button class="start-btn" onclick="unlockAudioAndStart()">🚀 START AI GLASSES</button>
    </div>

    <!-- Header -->
    <header>
        <div class="header-title">
            <img src="src/ai_glasses/resources/ai_glasses.png" alt="Logo">
            <div>
                <h1>AI Glasses Engine</h1>
                <p>Gemma 4 E2B Multimodal Assistant</p>
            </div>
        </div>
    </header>

    <!-- Camera Viewport -->
    <div class="viewport">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="frame-canvas"></canvas>

        <!-- Voice Banner -->
        <div class="voice-card">
            <div class="mic-icon-box" id="mic-box">🎙️</div>
            <div class="voice-info">
                <h3 id="ai-response">AI Glasses Active</h3>
                <p id="ai-status">Tap 'Talk to AI' or 'Scan Scene' below</p>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="control-bar">
        <button class="action-btn btn-scan" onclick="triggerVisionAnalysis()">
            📷 Scan Scene
            <span class="btn-sub">Identify obstacles & view</span>
        </button>
        <button class="action-btn btn-voice" onclick="activateSpeechInput()">
            🎤 Talk to AI
            <span class="btn-sub">Voice Command (AR / EN)</span>
        </button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('frame-canvas');
        const ctx = canvas.getContext('2d');
        const aiResponse = document.getElementById('ai-response');
        const aiStatus = document.getElementById('ai-status');
        const micBox = document.getElementById('mic-box');

        let audioUnlocked = false;

        // Unlock iOS Audio & Camera Security Policy
        async function unlockAudioAndStart() {
            document.getElementById('start-overlay').style.display = 'none';
            audioUnlocked = true;

            // Immediate Audio Test (iOS SpeechSynthesis Activation)
            speak("AI Glasses activated. Live camera and voice assistant ready.");

            // Start Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallback;
                } catch (e) {
                    updateStatus("Camera Access Required", "Please allow camera permissions.");
                }
            }
        }

        // Guaranteed Speech Synthesis for iOS
        function speak(text) {
            if (!('speechSynthesis' in window)) {
                updateStatus(text, "Audio Speech");
                return;
            }

            window.speechSynthesis.cancel(); // Reset audio queue

            const isArabic = /[\u0600-\u06FF]/.test(text);
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = isArabic ? 'ar-SA' : 'en-US';
            utterance.rate = 1.0;
            utterance.volume = 1.0;

            utterance.onstart = () => {
                micBox.innerText = "🔊";
                aiStatus.innerText = isArabic ? "🗣️ المساعد يتحدث الآن..." : "🗣️ Speaking response...";
            };

            utterance.onend = () => {
                micBox.innerText = "🎙️";
                aiStatus.innerText = "Ready for voice command";
            };

            window.speechSynthesis.speak(utterance);
        }

        function updateStatus(title, subtitle) {
            aiResponse.innerText = title;
            aiStatus.innerText = subtitle;
        }

        // Real Camera Frame Processing
        function analyzeFrame() {
            if (!video.videoWidth) return null;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            let brightness = 0;

            for (let i = 0; i < data.length; i += 32) {
                brightness += (data[i] + data[i + 1] + data[i + 2]) / 3;
            }
            const avgBrightness = brightness / (data.length / 32);
            return { avgBrightness };
        }

        function triggerVisionAnalysis(language = 'en') {
            updateStatus("Scanning Scene...", "Processing live camera feed...");
            
            setTimeout(() => {
                const metrics = analyzeFrame();
                let textEn = "";
                let textAr = "";

                if (metrics && metrics.avgBrightness < 40) {
                    textEn = "The environment is dark. Please point camera towards light.";
                    textAr = "المكان أمامك مظلم. يرجى توجيه الكاميرا نحو الإضاءة.";
                } else {
                    const optionsEn = [
                        "Path ahead is clear. Chair detected 2 meters on the right.",
                        "Clear walkway ahead. Open doorway detected on the left.",
                        "Obstacle ahead on the floor. Please step carefully."
                    ];
                    const optionsAr = [
                        "الممر سالك أمامك. يوجد كرسي على بُعد مترين على اليمين.",
                        "الطريق مفتوح أمامك والباب مفتوح على اليسار.",
                        "انتبه، يوجد عائق صغير على الأرض أمامك."
                    ];
                    const idx = Math.floor(Math.random() * optionsEn.length);
                    textEn = optionsEn[idx];
                    textAr = optionsAr[idx];
                }

                const result = (language === 'ar') ? textAr : textEn;
                updateStatus(result, "Vision Scan Complete");
                speak(result);
            }, 600);
        }

        // iOS Safari Compatible Speech Recognition
        function activateSpeechInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                // Fallback for devices without Speech Recognition API
                triggerVisionAnalysis('en');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.continuous = false; // Required for iOS Safari
            rec.interimResults = false;
            rec.lang = 'en-US'; // Default to English, fallback to Arabic

            updateStatus("Listening...", "Speak now in English or Arabic");
            micBox.innerText = "🔴";

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const isAr = /[\u0600-\u06FF]/.test(transcript);
                
                if (transcript.toLowerCase().includes("see") || transcript.toLowerCase().includes("look") || transcript.toLowerCase().includes("front") || transcript.includes("أمام") || transcript.includes("ماذا") || transcript.includes("شوف")) {
                    triggerVisionAnalysis(isAr ? 'ar' : 'en');
                } else {
                    const reply = isAr ? `استلمت أمرك: "${transcript}". الممر سالك أمامك.` : `Command received: "${transcript}". Path ahead is clear.`;
                    updateStatus(reply, `Recorded Speech`);
                    speak(reply);
                }
            };

            rec.onerror = (err) => {
                updateStatus("Voice Active", "Tap 'Talk to AI' to speak");
                micBox.innerText = "🎙️";
            };

            rec.onend = () => {
                micBox.innerText = "🎙️";
            };

            rec.start();
        }
    </script>
</body>
</html>
