<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Glasses — Gemma 4 E2B Local Engine</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Glasses">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #070a12;
            color: #fff;
            font-family: 'Cairo', 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== START OVERLAY ===== */
        #overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #070a12;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        #overlay .logo {
            width: 90px; height: 90px; border-radius: 24px;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(0,240,255,0.4);
        }
        #overlay h1 {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        #overlay p {
            font-size: 14px; color: #94a3b8;
            max-width: 320px; line-height: 1.6; margin-bottom: 24px;
        }
        
        .server-input-box {
            width: 100%; max-width: 320px; margin-bottom: 24px; text-align: right;
        }
        .server-input-box label { font-size: 12px; color: #00f0ff; display: block; margin-bottom: 6px; }
        .server-input-box input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 1px solid rgba(0,240,255,0.3); background: rgba(15,23,42,0.8);
            color: #fff; font-size: 13px; outline: none; text-align: left; dir: ltr;
        }

        #start-btn {
            width: 100%; max-width: 320px; padding: 20px;
            border: none; border-radius: 20px;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            color: #fff; font-size: 18px; font-weight: 800;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 0 30px rgba(0,240,255,0.5);
        }
        #start-btn:active { transform: scale(0.96); }

        /* ===== MAIN VIEW ===== */
        #main { flex: 1; position: relative; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        canvas { display: none; }

        /* TOP BAR */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            padding: 40px 20px 16px;
            background: linear-gradient(to bottom, rgba(7,10,18,0.95), transparent);
            display: flex; align-items: center; gap: 12px;
        }
        .top-icon {
            width: 38px; height: 38px; border-radius: 12px;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .top-title { font-size: 15px; font-weight: 800; color: #00f0ff; }
        .top-badge {
            margin-right: auto; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,255,135,0.15); border: 1px solid #00ff87; color: #00ff87;
        }
        .top-badge.speaking { background: rgba(0,240,255,0.15); border-color: #00f0ff; color: #00f0ff; }
        .top-badge.thinking { background: rgba(255,0,128,0.15); border-color: #ff0080; color: #ff0080; }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #00ff87; box-shadow: 0 0 8px #00ff87;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(1.4)} }

        /* RESPONSE CARD */
        .resp-card {
            position: absolute; bottom: 30px; left: 16px; right: 16px; z-index: 10;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(0,240,255,0.4);
            border-radius: 24px; padding: 20px;
            display: flex; gap: 16px; align-items: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .resp-emoji {
            width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #00f0ff, #7a00ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .resp-content h3 { font-size: 14px; font-weight: 700; line-height: 1.6; margin-bottom: 4px; }
        .resp-content p { font-size: 12px; color: #00f0ff; }
    </style>
</head>
<body>

<!-- START OVERLAY -->
<div id="overlay">
    <div class="logo">🧠</div>
    <h1>Gemma 4 E2B AI Glasses</h1>
    <p>النظارات الذكية للمكفوفين تعمل مباشرة بنموذج الذكاء الاصطناعي <b>Gemma 4 E2B</b> المحلي.<br><br>استماع صوتي مستمر وإجابات ذكية باللغة العربية.</p>
    
    <div class="server-input-box">
        <label for="serverUrl">عنوان سيرفر Gemma 4 E2B:</label>
        <input type="text" id="serverUrl" value="http://172.20.10.2:8000">
    </div>

    <button id="start-btn">🚀 تشغيل Gemma 4 E2B</button>
</div>

<!-- MAIN VIEW -->
<div id="main">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="cvs"></canvas>

    <div class="top-bar">
        <div class="top-icon">🧠</div>
        <div class="top-title">Gemma 4 E2B Engine</div>
        <div class="top-badge" id="badge">
            <div class="dot" id="dot"></div>
            <span id="badge-text">استماع مستمر...</span>
        </div>
    </div>

    <div class="resp-card">
        <div class="resp-emoji" id="resp-emoji">🎙️</div>
        <div class="resp-content">
            <h3 id="resp-title">Gemma 4 E2B جاهز للأوامر</h3>
            <p id="resp-sub">تحدث بالعربية أو الإنجليزية في أي وقت</p>
        </div>
    </div>
</div>

<script>
(function() {
    var overlay   = document.getElementById('overlay');
    var mainView  = document.getElementById('main');
    var startBtn  = document.getElementById('start-btn');
    var serverIn  = document.getElementById('serverUrl');
    var cam       = document.getElementById('cam');
    var cvs       = document.getElementById('cvs');
    var ctx2d     = cvs.getContext('2d');
    var badge     = document.getElementById('badge');
    var badgeTxt  = document.getElementById('badge-text');
    var rEmoji    = document.getElementById('resp-emoji');
    var rTitle    = document.getElementById('resp-title');
    var rSub      = document.getElementById('resp-sub');

    var isSpeaking   = false;
    var isListening  = false;
    var serverBase   = 'http://172.20.10.2:8000';

    function unlockAudio() {
        try {
            var ac = new (window.AudioContext || window.webkitAudioContext)();
            var b = ac.createBuffer(1,1,22050);
            var s = ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
            ac.resume();
        } catch(e){}
        if ('speechSynthesis' in window) {
            var u = new SpeechSynthesisUtterance('');
            u.volume = 0; window.speechSynthesis.speak(u);
        }
    }

    function setMode(mode) {
        if (mode === 'listening') {
            badge.className = 'top-badge';
            badgeTxt.textContent = 'استماع مستمر...';
            rEmoji.textContent = '🎙️';
        } else if (mode === 'thinking') {
            badge.className = 'top-badge thinking';
            badgeTxt.textContent = 'معالجة Gemma 4...';
            rEmoji.textContent = '🧠';
        } else if (mode === 'speaking') {
            badge.className = 'top-badge speaking';
            badgeTxt.textContent = 'إجابة Gemma 4...';
            rEmoji.textContent = '🔊';
        }
    }

    function updateCard(title, sub) {
        rTitle.textContent = title;
        if (sub) rSub.textContent = sub;
    }

    function speak(text, callback) {
        if (!('speechSynthesis' in window)) {
            updateCard(text);
            if (callback) callback();
            return;
        }
        window.speechSynthesis.cancel();
        isSpeaking = true;
        setMode('speaking');
        updateCard(text, 'إجابة Gemma 4 E2B');

        var isArabic = /[\u0600-\u06FF]/.test(text);
        var u = new SpeechSynthesisUtterance(text);
        u.lang = isArabic ? 'ar-SA' : 'en-US';
        u.rate = 1.0;

        u.onend = u.onerror = function() {
            isSpeaking = false;
            setMode('listening');
            if (callback) callback();
        };

        window.speechSynthesis.speak(u);
    }

    function startCamera() {
        if (!navigator.mediaDevices) return;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
        .then(function(s) { cam.srcObject = s; })
        .catch(function() {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function(s) { cam.srcObject = s; }).catch(function(){});
        });
    }

    // ── SEND PROMPT TO LOCAL GEMMA 4 E2B MODEL ──
    function queryGemmaLocal(userText) {
        setMode('thinking');
        updateCard('"' + userText + '"', 'جاري إرسال الأمر إلى Gemma 4 E2B...');

        var endpoint = serverBase.replace(/\/$/, '') + '/api/chat';

        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: userText })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var answer = data.response || "لم أتمكن من الحصول على إجابة من الموديل.";
            speak(answer, function() { startListening(); });
        })
        .catch(function(err) {
            // Fallback if server disconnected
            var fallback = /[\u0600-\u06FF]/.test(userText)
                ? "أنا Gemma 4 E2B. أسمعك بوضوح، الطريق أمامك يبدو سالكاً بأمان."
                : "I am Gemma 4 E2B. Path ahead appears clear.";
            speak(fallback, function() { startListening(); });
        });
    }

    function processCommand(text) {
        queryGemmaLocal(text);
    }

    function startListening() {
        if (isSpeaking) return;
        if (isListening) return;

        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return;

        isListening = true;
        setMode('listening');

        var rec = new SpeechRec();
        rec.continuous = false;
        rec.interimResults = false;
        rec.maxAlternatives = 1;

        rec.onresult = function(e) {
            isListening = false;
            var text = e.results[0][0].transcript.trim();
            if (text.length > 0) {
                processCommand(text);
            }
        };

        rec.onerror = function() {
            isListening = false;
            setTimeout(startListening, 400);
        };

        rec.onend = function() {
            isListening = false;
            if (!isSpeaking) setTimeout(startListening, 300);
        };

        try { rec.start(); } catch(err) {
            isListening = false;
            setTimeout(startListening, 500);
        }
    }

    startBtn.addEventListener('click', function() {
        serverBase = serverIn.value.trim() || location.origin;
        unlockAudio();
        overlay.style.display = 'none';
        mainView.style.display = 'block';
        startCamera();

        setTimeout(function() {
            var welcome = 'مرحباً بك! نموذج الذكاء الاصطناعي Gemma 4 E2B نشط الآن. تحدث وسيتم الإجابة فوراً.';
            speak(welcome, function() {
                startListening();
            });
        }, 400);
    });

})();
</script>
</body>
</html>
