<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Glasses — Gemma 4 E2B</title>
    
    <!-- PWA Settings for iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Glasses">
    <link rel="apple-touch-icon" href="src/ai_glasses/resources/ai_glasses.png">
    <link rel="icon" type="image/png" href="src/ai_glasses/resources/ai_glasses.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.8);
            --accent-blue: #00d2ff;
            --accent-purple: #7a00ff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-glow: rgba(0, 210, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(122, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            padding: 16px 20px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--border-glow);
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* --- Status Pill --- */
        .status-bar {
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 12px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff87;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff87;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- Chat Area --- */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.system {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            border-radius: 20px;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent-blue), #0072ff);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(10px);
        }

        /* --- Quick Actions Bar (Camera / Mic) --- */
        .action-bar {
            padding: 10px 20px;
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-glow);
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:active {
            transform: scale(0.96);
            background: rgba(0, 210, 255, 0.2);
        }

        /* --- Input Bar --- */
        .input-area {
            padding: 16px 20px 24px 20px;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .text-input:focus {
            border-color: var(--accent-blue);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        /* Hidden camera input */
        #camera-file-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <img src="src/ai_glasses/resources/ai_glasses.png" alt="AI Glasses Logo" class="header-logo">
        <div class="header-title">
            <h1>AI Glasses</h1>
            <p>Gemma 4 E2B • Local Multimodal Engine</p>
        </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="pulse-dot"></div>
        <span id="status-text">Model Ready — Connected to Gemma 4 E2B</span>
    </div>

    <!-- Chat History -->
    <div class="chat-container" id="chat-container">
        <div class="msg system">
            🕶️ Welcome to AI Glasses. Vision, Voice & Text processing ready.
        </div>
    </div>

    <!-- Quick Actions (Camera & Mic) -->
    <div class="action-bar">
        <button class="action-btn" onclick="triggerCamera()">
            📷 Camera
        </button>
        <button class="action-btn" onclick="triggerMic()">
            🎤 Microphone
        </button>
    </div>

    <input type="file" id="camera-file-input" accept="image/*" capture="environment" onchange="handleImageCaptured(event)">

    <!-- Input Bar -->
    <div class="input-area">
        <input type="text" id="user-input" class="text-input" placeholder="Ask AI Glasses..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendTextMessage()">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const statusText = document.getElementById('status-text');

        function addMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendTextMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            statusText.innerText = "🤔 Gemma 4 E2B is thinking...";

            setTimeout(() => {
                const response = `Gemma 4 E2B Response: I processed your query "${text}". As your smart glasses assistant, I am ready for your next instruction.`;
                addMessage(response, 'ai');
                statusText.innerText = "Model Ready — Connected to Gemma 4 E2B";
            }, 800);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendTextMessage();
            }
        }

        function triggerCamera() {
            document.getElementById('camera-file-input').click();
        }

        function handleImageCaptured(event) {
            const file = event.target.files[0];
            if (file) {
                addMessage("📷 [Captured photo with smart glasses camera]", 'user');
                statusText.innerText = "🔍 Analyzing image with Gemma 4 Vision...";
                
                setTimeout(() => {
                    addMessage("AI Vision: I see your surroundings clearly. The visual context has been processed by Gemma 4 E2B.", 'ai');
                    statusText.innerText = "Model Ready — Connected to Gemma 4 E2B";
                }, 1200);
            }
        }

        function triggerMic() {
            addMessage("🎤 [Voice command recorded]", 'user');
            statusText.innerText = "🎙️ Listening and parsing audio...";
            
            setTimeout(() => {
                addMessage("AI Voice: Audio stream processed. Voice command received and executed.", 'ai');
                statusText.innerText = "Model Ready — Connected to Gemma 4 E2B";
            }, 1000);
        }
    </script>
</body>
</html>
