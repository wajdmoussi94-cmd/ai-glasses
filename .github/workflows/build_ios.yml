name: Build AI Glasses for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===== الخطوة 1: التحقق من صحة الكود على Linux =====
  test-code:
    name: Validate Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check Python Syntax Only (no GUI import)
        run: |
          python -m py_compile src/ai_glasses/__main__.py
          python -m py_compile src/ai_glasses/model_handler.py
          echo "✅ Syntax check passed!"

  # ===== الخطوة 2: بناء iOS على Mac =====
  build-ios:
    name: Build for iPhone (iOS)
    runs-on: macos-latest
    needs: test-code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Create iOS Project
        run: briefcase create iOS

      - name: Build iOS App
        run: briefcase build iOS

      - name: Upload iOS Build
        uses: actions/upload-artifact@v3
        with:
          name: AI-Glasses-iOS-App
          path: build/
          retention-days: 14
