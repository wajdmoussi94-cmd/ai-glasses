name: Build AI Glasses for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===== Step 1: Validate Python Syntax =====
  test-code:
    name: Validate Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python Syntax
        run: |
          python -m py_compile src/ai_glasses/__main__.py
          python -m py_compile src/ai_glasses/model_handler.py
          echo "✅ Syntax check passed!"

  # ===== Step 2: Build iOS App =====
  build-ios:
    name: Build for iPhone (iOS)
    runs-on: macos-14
    needs: test-code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install briefcase, toga, and pillow
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga pillow

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Create iOS Project (with Pillow for custom icon generation)
        run: briefcase create iOS

      - name: Build iOS App
        run: briefcase build iOS

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Glasses-iOS-App
          path: build/
          retention-days: 14
