name: Build AI Glasses for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===== Step 1: Validate Python Syntax =====
  test-code:
    name: Validate Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python Syntax
        run: |
          python -m py_compile src/ai_glasses/__main__.py
          python -m py_compile src/ai_glasses/model_handler.py
          echo "✅ Syntax check passed!"

  # ===== Step 2: Build Real iPhone IPA File (iphoneos ARM64 SDK) =====
  build-ios:
    name: Build Ready-to-Install iPhone IPA
    runs-on: macos-14
    needs: test-code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install briefcase, toga, and pillow
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga pillow

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Create iOS Xcode Project
        run: briefcase create iOS

      - name: Compile for Physical iPhone Device (xcodebuild -sdk iphoneos)
        run: |
          xcodebuild -project "build/ai_glasses/ios/xcode/AI Glasses.xcodeproj" \
            -scheme "AI Glasses" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package directly into ready-to-use AIGlasses.ipa
        run: |
          mkdir -p build_ipa/Payload
          cp -R "build/ai_glasses/ios/xcode/build/Release-iphoneos/AI Glasses.app" build_ipa/Payload/
          cd build_ipa && zip -r AIGlasses.ipa Payload

      - name: Upload Ready AIGlasses.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Glasses-IPA-Ready
          path: build_ipa/AIGlasses.ipa
          retention-days: 14
