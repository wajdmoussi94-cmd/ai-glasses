name: Build AI Glasses for iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build for iPhone (iOS)
    runs-on: macos-13  # استخدام macOS 13 (Ventura) لثبات أكثر

    steps:
      # 1. تحميل الكود
      - name: Checkout Code
        uses: actions/checkout@v3  # نسخة أقدم وأكثر استقراراً

      # 2. تثبيت بايثون 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. تثبيت Xcode Command Line Tools
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 4. تثبيت مكتبات بايثون
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      # 5. إنشاء هيكل مشروع iOS
      - name: Create iOS Project
        run: briefcase create iOS -p Xcode

      # 6. بناء التطبيق
      - name: Build iOS App
        run: briefcase build iOS -p Xcode

      # 7. رفع نتيجة البناء
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AI-Glasses-iOS-Build
          path: build/ai_glasses/ios/
          retention-days: 7
