name: Build AI Glasses for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===== Step 1: Validate Python Syntax =====
  test-code:
    name: Validate Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python Syntax
        run: |
          python -m py_compile src/ai_glasses/__main__.py
          python -m py_compile src/ai_glasses/model_handler.py
          echo "✅ Syntax check passed!"

  # ===== Step 2: Build for PHYSICAL iPhone Device (iphoneos ARM64) =====
  build-ios:
    name: Build for Physical iPhone Device
    runs-on: macos-14
    needs: test-code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install briefcase, toga, and pillow (pillow is REQUIRED for custom icon generation)
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga pillow

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Create iOS Project
        run: briefcase create iOS

      - name: Build for Physical Device (iphoneos SDK ARM64)
        run: |
          briefcase build iOS -d -- --no-sign CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER=""

      - name: Upload iOS Device Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Glasses-iOS-App
          path: build/
          retention-days: 14
